# Decap CMS settings for libertypaintingnwa.net
backend:
  name: github
  repo: davidnichols3426-glitch/liberty-painting-site
  branch: main
  commit_messages:
    create: "New post: {{slug}}"
    update: "Update post: {{slug}}"
    delete: "Delete post: {{slug}}"
    uploadMedia: "Upload photo: {{path}}"
    deleteMedia: "Delete photo: {{path}}"

site_url: https://www.libertypaintingnwa.net
logo_url: https://www.libertypaintingnwa.net/assets/img0.png

# Where uploaded photos are saved and how pages link to them
media_folder: "assets/uploads"
public_folder: "https://www.libertypaintingnwa.net/assets/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "blog/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["date", "title"]
    summary: "{{title}}  ({{year}}-{{month}}-{{day}})"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "MMM D, YYYY", time_format: false, picker_utc: true }
      - { label: "Short Summary (shows on the blog page and in Google)", name: "description", widget: "text" }
      - { label: "Cover Photo", name: "image", widget: "image", required: false }
      - { label: "Cover Photo Description (for Google and screen readers)", name: "imageAlt", widget: "string", required: false }
      - { label: "Read Time (minutes)", name: "readTime", widget: "number", value_type: "int", min: 1, required: false }
      - { label: "Published (turn off to hide this post)", name: "published", widget: "boolean", default: true }
      - { label: "Article", name: "body", widget: "markdown" }

  - name: "portfolio"
    label: "Portfolio Projects"
    label_singular: "Portfolio Project"
    folder: "portfolio/projects"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["date", "title"]
    summary: "{{title}}  ({{location}})"
    fields:
      - { label: "Project Name (example: Exterior Repaint)", name: "title", widget: "string" }
      - { label: "Location (example: Rogers home)", name: "location", widget: "string", required: false }
      - { label: "Date (newest projects show first)", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "MMM D, YYYY", time_format: false, picker_utc: true }
      - { label: "Main Photo (the finished job)", name: "photo", widget: "image" }
      - { label: "Before Photo (adds a before/after slider)", name: "beforePhoto", widget: "image", required: false }
      - { label: "Photo Description (for Google and screen readers)", name: "imageAlt", widget: "string", required: false }
      - { label: "Short Details (1 or 2 sentences)", name: "details", widget: "text", required: false }
      - label: "More Photos (shown when someone opens this project)"
        name: "gallery"
        widget: "list"
        required: false
        collapsed: false
        summary: "{{fields.caption}}"
        fields:
          - { label: "Photo", name: "image", widget: "image" }
          - { label: "Caption (optional)", name: "caption", widget: "string", required: false }
      - { label: "Published (turn off to hide this project)", name: "published", widget: "boolean", default: true }
